<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Eigenständiges rundenbasiertes 2D-Artillery-Browsergame."><meta name="theme-color" content="#0d111a">
  <title>Worms Arena • LIVE BUILD 4BF46</title><link rel="stylesheet" href="./css/style.css?v=5"><style id="critical-ui">:root{font-family:system-ui,sans-serif;color:#f4f7ff;background:#0d111a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#26324a,#0d111a 70%)}button{font:inherit;border:1px solid #34405a;border-radius:.65rem;padding:.7rem .9rem;background:#d7ff64;color:#111827;font-weight:800;cursor:pointer}.app-shell{min-height:100vh;padding:clamp(1rem,3vw,3rem);display:grid;place-items:center}.screen{width:min(1200px,100%)}.is-hidden{display:none}.hero{text-align:center;margin-bottom:1.5rem}.hero h1{font-size:clamp(2.5rem,7vw,5rem);margin:.2rem 0}.menu-actions{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin:.75rem 0}.map-preview,.customization,.hud{background:#172033;border:1px solid #34405a;border-radius:1rem;padding:1rem}.customization{max-width:760px;margin:1.2rem auto}.worm-config{display:grid;grid-template-columns:1.4fr repeat(6,auto);gap:.35rem;align-items:center}.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1rem}.canvas-wrap{background:#090d14;border:1px solid #34405a;border-radius:1rem;padding:.5rem}.canvas-wrap canvas{display:block;width:100%;height:auto}.hud{display:grid;gap:.6rem}.primary-start{font-size:1.05rem;padding:.85rem 1.25rem}@media(max-width:850px){.game-layout{grid-template-columns:1fr}.worm-config{grid-template-columns:1fr 1fr 1fr 1fr}}</style>
</head>
<body>
<main id="app" class="app-shell">
  <section id="menu-screen" class="screen">
    <header class="hero"><p class="eyebrow">ARTILLERY ARENA</p><h1>Worms Arena</h1><p>Rundenbasierte Gefechte auf zerstörbaren Welten.</p></header>
    <div id="map-preview" class="map-preview" aria-live="polite">Welt 1 – Grüne Hügel</div>
    <div class="menu-actions" aria-label="Weltauswahl"><button data-map="meadow">Welt 1</button><button data-map="canyon">Welt 2</button><button data-map="frost">Welt 3</button><button data-map="volcano">Welt 4</button></div>
    <div class="menu-actions" aria-label="KI-Schwierigkeit"><button data-difficulty="easy">Einfach</button><button data-difficulty="normal">Normal</button><button data-difficulty="hard">Schwer</button></div>
    <div class="menu-actions" aria-label="Teamgröße"><button data-team-size="1">1 Wurm</button><button data-team-size="2">2 Würmer</button><button data-team-size="3">3 Würmer</button></div>
    <section id="customization" class="customization" aria-label="Wurm-Anpassung"><h2>Würmer</h2><div id="worm-configs"></div></section>
    <div id="menu-actions" class="menu-actions" aria-label="Hauptmenü">
      <button data-action="start-pc" class="primary-start">▶ SPIEL STARTEN</button><button data-action="start-pc">Gegen PC</button><button data-action="start-online">Online</button><button data-action="settings">Einstellungen</button><button id="audio-toggle" type="button">Audio</button><button data-action="credits">Credits / Info</button>
    </div>
  </section>
  <section id="online-screen" class="screen is-hidden">
    <header class="hero"><h2>Online-Lobby</h2><p id="online-status">Nicht verbunden</p></header>
    <div class="menu-actions"><button id="online-create">Lobby erstellen</button><input id="online-code" placeholder="Lobby-Code" maxlength="6" aria-label="Lobby-Code"><button id="online-join">Lobby beitreten</button><button id="online-start">Match starten</button><button id="online-back">Zurück</button></div>
    <p id="online-code-display"></p><p id="online-players">Spieler: 0/2</p>
  </section>
  <section id="game-screen" class="screen is-hidden" aria-label="Spiel">
    <div class="game-layout"><div class="canvas-wrap"><canvas id="game-canvas" width="960" height="540" aria-label="Spielwelt"></canvas></div>
      <aside id="hud" class="hud" aria-live="polite">
        <section id="game-over-panel" class="game-over is-hidden"><h2 id="result-title">Match beendet</h2><p id="result-duration">—</p><button id="replay-button" type="button">Nochmal spielen</button></section>
        <div><span>Team</span><strong id="hud-team">—</strong></div><div><span>Wurm</span><strong id="hud-worm">—</strong></div><div><span>HP</span><strong id="hud-hp">—</strong></div><div><span>Wind</span><strong id="hud-wind">—</strong></div><div><span>Waffe</span><strong id="hud-weapon">Bazooka</strong></div><div><span>Status</span><strong id="hud-status">—</strong></div><div><span>Stärke</span><strong id="hud-power">—</strong></div>
        <div id="worm-selection" class="worm-selection" aria-label="Wurmauswahl"></div>
        <div id="weapon-selection" class="weapon-selection" aria-label="Waffenauswahl"><button type="button" data-weapon="bazooka">Bazooka</button><button type="button" data-weapon="grenade">Granate</button><button type="button" data-weapon="dynamite">Dynamit</button></div>
        <button id="shoot-button" type="button">Schießen</button><button id="end-turn" type="button">Zug beenden</button><button id="back-menu" type="button">Menü</button>
      </aside>
    </div>
  </section>
</main>
<script type="module">
  import("./js/main.js?v=5").catch(error=>{
    console.error("Worms Arena konnte nicht gestartet werden:",error);
    const box=document.createElement("div");
    box.style.cssText="position:fixed;inset:auto 1rem 1rem 1rem;z-index:9999;padding:1rem;background:#5b1720;color:#fff;border:2px solid #ff7c8a;border-radius:12px;font:600 14px/1.4 system-ui;box-shadow:0 10px 30px #0008";
    box.innerHTML="<strong>Spiel konnte nicht gestartet werden.</strong><br><span>"+String(error?.message||error)+"</span>";
    document.body.appendChild(box);
  });
</script>
</body></html>
